name: qfieldcloud

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 100m
    max-file: "5"

x-django-environment: &django-environment
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?required}"
  DJANGO_USE_X_FORWARDED_HOST: "1"
  DJANGO_SETTINGS_MODULE: qfieldcloud.settings
  SECRET_KEY: "${SECRET_KEY:?required}"
  SALT_KEY: "${SALT_KEY:?required}"
  DEBUG: "0"
  ENVIRONMENT: production
  SENTRY_DSN: ""
  SENTRY_RELEASE: "${QFIELDCLOUD_RELEASE:?required}"
  SENTRY_ENVIRONMENT: production
  SENTRY_SAMPLE_RATE: "0"
  POSTGRES_DB: "${POSTGRES_DB:?required}"
  POSTGRES_DB_TEST: "test_${POSTGRES_DB:?required}"
  POSTGRES_USER: "${POSTGRES_USER:?required}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: prefer
  STORAGES: '${STORAGES:?required}'
  STORAGES_PROJECT_DEFAULT_STORAGE: ""
  STORAGES_PROJECT_DEFAULT_ATTACHMENTS_STORAGE: ""
  STORAGE_PROJECT_DEFAULT_ATTACHMENTS_VERSIONED: "1"
  COMPOSE_PROJECT_NAME: qfieldcloud
  QFIELDCLOUD_DEFAULT_NETWORK: qfieldcloud_default
  QFIELDCLOUD_PASSWORD_LOGIN_IS_ENABLED: "1"
  ACCOUNT_EMAIL_VERIFICATION: optional
  SOCIALACCOUNT_PROVIDERS: "{}"
  EMAIL_HOST: smtp4dev
  EMAIL_USE_TLS: "False"
  EMAIL_USE_SSL: "False"
  EMAIL_PORT: "25"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  DEFAULT_FROM_EMAIL: webmaster@localhost.invalid
  CORS_ALLOWED_ORIGINS: "https://${QFIELDCLOUD_HOST:?required}"
  CORS_ALLOW_CREDENTIALS: "1"
  QFIELDCLOUD_HOST: "${QFIELDCLOUD_HOST:?required}"
  QFIELDCLOUD_ADMIN_URI: admin/
  QFIELDCLOUD_WORKER_QFIELDCLOUD_URL: "http://${QFIELDCLOUD_HOST:?required}/api/v1/"
  QFIELDCLOUD_SUBSCRIPTION_MODEL: subscription.Subscription
  QFIELDCLOUD_ACCOUNT_ADAPTER: qfieldcloud.core.adapters.AccountAdapterSignUpClosed
  QFIELDCLOUD_AUTH_TOKEN_EXPIRATION_HOURS: "720"
  QFIELDCLOUD_USE_I18N: "1"
  QFIELDCLOUD_DEFAULT_LANGUAGE: en
  QFIELDCLOUD_DEFAULT_TIME_ZONE: Asia/Seoul
  QFIELDCLOUD_QGIS3_IMAGE_NAME: "${QFC_QGIS3_IMAGE:?required}"
  QFIELDCLOUD_QGIS4_IMAGE_NAME: "${QFC_QGIS4_IMAGE:?required}"
  QFIELDCLOUD_TRANSFORMATION_GRIDS_VOLUME_NAME: qfieldcloud_transformation_grids

services:
  db:
    image: "${POSTGIS_IMAGE:?required}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?required}"
      POSTGRES_USER: "${POSTGRES_USER:?required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  rustfs:
    image: "${RUSTFS_IMAGE:?required}"
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "${OBJECT_STORAGE_ROOT_USER:?required}"
      RUSTFS_SECRET_KEY: "${OBJECT_STORAGE_ROOT_PASSWORD:?required}"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_EXTERNAL_ADDRESS: :9000
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging: *default-logging

  createbuckets:
    image: "${QFC_CREATEBUCKETS_IMAGE:?required}"
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      STORAGES: '${STORAGES:?required}'
    logging: *default-logging

  smtp4dev:
    image: "${SMTP4DEV_IMAGE:?required}"
    restart: unless-stopped
    environment:
      ServerOptions__HostName: smtp4dev
    volumes:
      - smtp4dev_data:/smtp4dev
    logging: *default-logging

  memcached:
    image: "${MEMCACHED_IMAGE:?required}"
    restart: unless-stopped
    command: ["memcached", "-m", "64", "-I", "8m"]
    expose:
      - "11211"
    logging: *default-logging

  app:
    image: "${QFC_APP_IMAGE:?required}"
    restart: unless-stopped
    command:
      - gunicorn
      - qfieldcloud.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --no-control-socket
      - --timeout
      - "300"
      - --max-requests
      - "300"
      - --workers
      - "2"
      - --threads
      - "2"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      memcached:
        condition: service_started
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/mediafiles
      - ./state/ca:/etc/ssl/custom_certs:ro
    environment: *django-environment
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.runcrons.no-overlap: "true"
      ofelia.job-exec.runcrons.schedule: "@every 1m"
      ofelia.job-exec.runcrons.command: python manage.py runcrons
    logging: *default-logging

  nginx:
    image: "${QFC_NGINX_IMAGE:?required}"
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./state/certs:/etc/nginx/certs:ro
      - ./state/dhparams:/etc/nginx/dhparams:ro
      - ./state/nginx-config:/etc/nginx/config.d:ro
      - static_volume:/var/www/html/staticfiles:ro
      - media_volume:/var/www/html/mediafiles:ro
    environment:
      DEBUG: "0"
      QFIELDCLOUD_HOST: "${QFIELDCLOUD_HOST:?required}"
      QFIELDCLOUD_TLS_CERT: /etc/nginx/certs/qfieldcloud.pem
      QFIELDCLOUD_TLS_KEY: /etc/nginx/certs/qfieldcloud-key.pem
      QFIELDCLOUD_TLS_DHPARAMS: /etc/nginx/dhparams/ssl-dhparams.pem
      WEB_HTTP_PORT: "80"
      WEB_HTTPS_PORT: "443"
      LETSENCRYPT_EMAIL: ""
      LETSENCRYPT_STAGING: "1"
      LETSENCRYPT_RSA_KEY_SIZE: "4096"
      NGINX_ERROR_LOG_LEVEL: error
      NGINX_CLIENT_MAX_BODY_SIZE: 2g
      NGINX_PROXY_CONNECT_TIMEOUT: 5s
      NGINX_PROXY_READ_TIMEOUT: 300s
      NGINX_PROXY_SEND_TIMEOUT: 300s
      NGINX_ALLOW_INTERNAL_HTTP: "1"
    networks:
      default:
        aliases:
          - "${QFIELDCLOUD_HOST:?required}"
    logging: *default-logging

  worker_wrapper:
    image: "${QFC_WORKER_WRAPPER_IMAGE:?required}"
    restart: unless-stopped
    command: ["python", "manage.py", "dequeue"]
    user: root
    depends_on:
      - app
      - nginx
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/mediafiles
      - transformation_grids:/transformation_grids
      - /var/run/docker.sock:/var/run/docker.sock
      - ./state/ca:/etc/ssl/custom_certs:ro
      # The wrapper starts sibling QGIS containers through the host Docker
      # daemon. Both containers must therefore refer to the same host path.
      - /tmp:/tmp
    environment:
      <<: *django-environment
      TMP_DIRECTORY: /tmp
    stop_grace_period: 15m
    logging: *default-logging

  ofelia:
    image: "${OFELIA_IMAGE:?required}"
    restart: unless-stopped
    depends_on:
      - app
    command: ["daemon", "--docker"]
    volumes:
      # The :ro mount flag protects the socket file path, not Docker API
      # operations. A compromised scheduler still has host-level control.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging

networks:
  default:
    name: qfieldcloud_default
    ipam:
      config:
        # Official QFieldCloud Nginx recognizes 172.16.0.0/12 as its trusted
        # Docker-internal source range when internal HTTP is enabled.
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
    name: qfieldcloud_postgres_data
  rustfs_data:
    name: qfieldcloud_rustfs_data
  smtp4dev_data:
    name: qfieldcloud_smtp4dev_data
  static_volume:
    name: qfieldcloud_static
  media_volume:
    name: qfieldcloud_media
  transformation_grids:
    name: qfieldcloud_transformation_grids

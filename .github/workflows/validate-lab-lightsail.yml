name: Validate lab-lightsail

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation (no AWS API)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check PowerShell and JSON syntax
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $parseErrors = @()
          Get-ChildItem -Recurse -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
          }
          Get-ChildItem -Recurse -Filter '*.json' -File |
            Where-Object { $_.FullName -notmatch '[\\/]output[\\/]' } |
            ForEach-Object { Get-Content -Raw -LiteralPath $_.FullName | ConvertFrom-Json | Out-Null }

      - name: Check Bash syntax and launcher isolation
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $gitBash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw 'Git for Windows Bash was not found.'
          }
          Get-ChildItem -LiteralPath scripts/lab-lightsail -Filter '*.sh' -File | ForEach-Object {
            & $gitBash -c 'export PATH=/usr/bin:/bin; bash -n "$1"' -- $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Bash syntax validation failed: $($_.Name)"
            }
          }
          & $gitBash -c 'export PATH=/usr/bin:/bin; exec bash "$1"' -- scripts/lab-lightsail/Test-LauncherInputIsolation.sh
          if ($LASTEXITCODE -ne 0) {
            throw 'Launcher input isolation regression validation failed.'
          }

      - name: Install pinned CloudFormation linter
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cfn-lint==1.55.1

      - name: Check source and downloadable CloudFormation templates
        shell: pwsh
        run: cfn-lint infra/lab-lightsail/template.yaml releases/lab-lightsail/v0.1.0/template.yaml releases/lab-lightsail/v0.1.1/template.yaml

      - name: Check one-click, release, documentation, and secret contracts
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'scripts/lab-lightsail/Test-OneClickContract.ps1'
            'scripts/release/Test-LabLightsailReleaseArtifacts.ps1'
            'tools/qfieldcloud-template-editor/Test-QFieldCloudTemplateEditor.ps1'
          )
          foreach ($test in $tests) {
            & pwsh -NoProfile -File $test
            if ($LASTEXITCODE -ne 0) {
              throw "Static contract validation failed: $test"
            }
          }

      - name: Check patch whitespace
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          }
          else {
            git show --check --format= HEAD
          }
